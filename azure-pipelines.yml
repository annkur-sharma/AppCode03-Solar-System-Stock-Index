# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: Default
  # vmImage: ubuntu-latest

variables:
- group: Project03-VariableGroup-Dev

stages:
- stage: StaticCodeAnalysis
  displayName: Static Code Analysis
  jobs:
  - job: SonarQubeAnalysisJob
    displayName: SonarQube (Static Code Analysis)
    steps:
    - task: PowerShell@2
      displayName: Run SonarQube CLI
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          mvn clean verify
          sonar-scanner -D sonar.token=$(SONAR_TOKEN)

  - job: CheckstyleScanJob
    displayName: Checkstyle CLI Scan (Static Code Analysis)
    steps:
    - task: PowerShell@2
      displayName: Run Checkstyle CLI
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          mvn clean verify
          mvn checkstyle:check

- stage: SoftwareCompositionAnalysis
  displayName: Software Composition Analysis (Dependency Security)
  jobs: 
  - job: DependencyVulnerabilityScan
    displayName: Dependency Vulnerability Scan (Retire.js)
    steps: 
    - task: PowerShell@2
      displayName: Run Dependency Security Scan
      inputs:
        targetType: 'inline'
        script: |
          npm install -g retire
          npm install
          retire --exitwith 0
      
- stage: CodeQualityChecks
  displayName: Code Quality & Linting
  jobs:
  - job: LintingChecks
    displayName: Multi-Language Linting Checks
    steps:
    - task: PowerShell@2
      continueOnError: true
      displayName: JavaScript Linting (Biome)
      inputs:
        targetType: 'inline'
        script: |
          Invoke-WebRequest -Uri "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%402.3.8/biome-win32-x64.exe" -OutFile "$(Agent.ToolsDirectory)/biome.exe"
          $(Agent.ToolsDirectory)/biome.exe lint "$(System.DefaultWorkingDirectory)/src/main/webapp/js/**/*.js"

    - task: PowerShell@2
      continueOnError: true
      displayName: CSS Linting (Stylelint)  
      inputs:
        targetType: 'inline'
        script: |
          npm install -g stylelint
          npm install -g stylelint-config-standard
          stylelint "$(System.DefaultWorkingDirectory)/src/**/*.css" || echo "Stylelint warnings detected"

    - task: PowerShell@2
      continueOnError: true
      displayName: YAML Linting (yamllint)
      inputs:
        targetType: 'inline'
        script: |
          pip install --user yamllint
          yamllint $(System.DefaultWorkingDirectory)

    - task: PowerShell@2
      continueOnError: true
      displayName: Markdown Linting (markdownlint)
      inputs:
        targetType: 'inline'
        script: |
          npm install -g markdownlint-cli
          markdownlint $(System.DefaultWorkingDirectory)

    
