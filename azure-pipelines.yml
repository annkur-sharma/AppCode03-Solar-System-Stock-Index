# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: Project03-VariableGroup-Dev

stages:
- stage: StaticCodeAnalysis
  displayName: Static Code Analysis
  jobs:
  - job: SonarQubeAnalysisJob
    displayName: SonarQube (Static Code Analysis)
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'sonar-scanner -D sonar.token=$(SONAR_TOKEN)'

  - job: CheckstyleScanJob
    displayName: Checkstyle CLI Scan (Static Code Analysis)
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        wget https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar
        java -jar checkstyle-10.12.4-all.jar \
          -c checkstyle.xml \
          src/main/java
      displayName: Run Checkstyle
      continueOnError: true

